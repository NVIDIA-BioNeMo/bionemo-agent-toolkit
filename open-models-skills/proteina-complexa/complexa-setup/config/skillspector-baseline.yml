# SkillSpector suppression baseline — complexa-setup
#
# Audited, false-positive suppression consumed by the NVSkills Tier 1 runner
# (.ci/run_validation_tier.sh passes this via `skillevaluator --skillspector-baseline`).
# Suppressed findings are NOT deleted: they remain in the report JSON marked
# `suppressed: true` with the reason below, so the decision stays auditable in
# the MR diff. A finding is suppressed only when every field set here
# glob-matches it (fnmatch, case-insensitive).
version: 1

rules:
  - id: "PE3"
    path: "*SKILL.md"
    reason: >-
      Reviewed false positive (BioNeMo, omosafi@nvidia.com, 2026-07-31).
      complexa-setup is a first-party setup skill whose documented purpose is
      generating and editing the project's own dotenv configuration file (the
      COMPLEXA_RUNTIME plus LOCAL_*_PATH placeholders) through the `complexa
      init` helper. The PE3 "Credential Access" matches are literal references
      to that project config file in the setup steps and the troubleshooting
      table of SKILL.md — user-facing configuration guidance, not credential
      theft. No SSH private keys, cloud credential stores, or secret token files
      are involved.
