name: skill-security

# Advisory offline scan: changed source skills on PRs, full catalog on main.
# Findings remain visible in JSON artifacts even when an existing reviewed
# per-skill baseline suppresses them from the risk score.

on:
  pull_request:
    paths:
      - "nim-skills/**"
      - "library-skills/**"
      - "open-models-skills/**"
      - "workflows/**"
      - ".github/workflows/skill-security.yml"
      - "scripts/scan_skills.py"
      - "scripts/plugin_sync.py"
      - "tests/test_scan_skills.py"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skillspector:
    runs-on: ubuntu-latest
    continue-on-error: true          # advisory: does not block merges
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test scan selection and failure handling
        run: python -m unittest discover -s tests -p test_scan_skills.py
      - name: Install pinned SkillSpector
        # SkillSpector 2.13.3, matching the NVCARPS SkillEvaluator 1.6.6 scan.
        # Pin the release commit so GitHub main changes cannot alter this check.
        run: |
          pip install "git+https://github.com/NVIDIA/skillspector.git@38a1dfe93325d2f8bfcd4f8d0241eed706334915"
          python - <<'PY'
          from importlib.metadata import version
          actual = version("skillspector")
          print(f"SkillSpector {actual}")
          if actual != "2.13.3":
              raise SystemExit("Expected SkillSpector 2.13.3")
          PY
      - name: Scan selected skills (offline)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            : "${PR_BASE_SHA:?Pull requests require a base revision}"
            args+=(--base-ref "$PR_BASE_SHA")
          fi
          python scripts/scan_skills.py "${args[@]}" \
            --output-dir "$RUNNER_TEMP/skillspector-reports"
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: ${{ runner.temp }}/skillspector-reports/
          if-no-files-found: ignore
