name: atomworks-studio
on:
  pull_request:
    paths:
      - 'integrations/atomworks-studio/**'
      - 'tests/test_atomworks_*.py'
      - 'tests/test_atomworks_*.mjs'
      - '.github/workflows/atomworks-studio.yml'
  push:
    branches: [main]
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts && node --check host/bridge.js && node --check build-upstream.mjs
        working-directory: integrations/atomworks-studio
      - run: node --test tests/test_atomworks_compute_ui.mjs
      - run: pip install -r integrations/atomworks-studio/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_atomworks_*.py'
