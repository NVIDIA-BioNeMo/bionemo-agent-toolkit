# Reviewed 2026-10-12 against NVCARPS SkillSpector 2.11.2.
# Exact fingerprints bind file contents, location, emitted evidence and scanner version.
# PE3 rules match exact file/evidence pairs because LLM annotations change fingerprint fields.
# Existing guards are unchanged; affected file hashes were re-reviewed after ranking/docs changes.
# New test-only exceptions bind mock imports and bounded, fixed-CLI subprocess calls.
# Re-review these exceptions after changing guarded call sites or execution.py.
# No rule-wide or cache/bytecode suppressions.
version: 2
scanner_version: 2.11.2
rules:
- id: PE3
  path: references/complexa-cli.md
  message: '.env

    '
  reason: The matched text is the comment describing complexa init writing its own configuration file.
    This exception is limited to that literal evidence in this setup reference; it does not allow credential-file
    access elsewhere. LLM annotations change exact fingerprints for the same comment.
- id: PE3
  path: references/setup.md
  message: '.env '
  reason: The matched text is the comment describing complexa init writing its own configuration file.
    This exception is limited to that literal evidence in this setup reference; it does not allow credential-file
    access elsewhere. LLM annotations change exact fingerprints for the same comment.
- id: PE3
  path: scripts/validate_binders.py
  message: .env"
  reason: The matched text is the comment documenting optional dotenv configuration. The reader accepts
    only NVIDIA_API_KEY or NGC_API_KEY as text, with environment precedence and no shell evaluation or
    logging. Local mode never loads credentials; hosted credentials go only to the validated NVIDIA HTTPS
    host with redirects blocked. This exception matches only this file and literal evidence, including
    when LLM annotations change the finding fingerprint. Re-review if credential handling changes.
