<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtomWorks Studio</title>
<style>
:root{font:14px system-ui;color:var(--color-text-primary,#202124);background:var(--color-background-primary,#fff);color-scheme:light dark}body{margin:0;padding:16px}header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0}p{line-height:1.5}button,input,textarea{font:inherit;border:1px solid #8886;border-radius:7px;padding:9px;background:transparent;color:inherit}button{cursor:pointer}button.primary{background:#306b4d;color:white}button:disabled{opacity:.5;cursor:wait}iframe{width:100%;height:60vh;min-height:380px;border:1px solid #8885;border-radius:8px;margin:12px 0}label{display:block;margin:8px 0}textarea{width:95%;height:48px}details{margin:12px 0}#status{white-space:pre-wrap}#review,#runs{padding:12px;border:1px solid #8885;border-radius:8px;margin-top:12px}.muted{opacity:.75}input[type=number]{width:70px}#scene[hidden], [hidden]{display:none!important}
</style>
<header><h1>AtomWorks Studio</h1><button id="demo">PD-L1 demo</button><label>Open CIF <input id="file" type="file" accept=".cif,.mmcif"></label></header>
<p class="muted">Explore in 3D. Select a region and edit its model instructions with Studio.</p>
<div id="status" role="status">Connecting to Codex…</div>
<iframe id="scene" title="AtomWorks Studio molecular editor" hidden></iframe>
<label for="note">Design notes</label><textarea id="note" placeholder="Describe what you want to change. Notes alone do not change model conditions."></textarea>
<label>Image note (PNG, optional) <input id="image-note" type="file" accept="image/png"></label><p id="image-label" class="muted"></p>
<details><summary>Generation settings</summary><label>Designs <input id="samples" type="number" value="1" min="1" max="16"></label><label>Seed <input id="seed" type="number" value="42" min="0" max="2147483647"></label></details>
<button id="prepare" class="primary" disabled>Review design</button>
<section id="review" hidden><strong>Prepared design</strong><p id="plan-summary"></p><p id="warnings"></p><button id="request" class="primary">Ask Codex to generate</button><small> Compute runs on Brev after host approval.</small></section>
<section id="runs"><div class="actions"><strong>Runs</strong><button id="refresh">Refresh</button></div><div id="run-list"></div></section>
<script>
const $=id=>document.getElementById(id);let sequence=0,connected=false,session=null,plan=null,imageNote=null;const pending=new Map();
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const timer=setTimeout(()=>{pending.delete(id);reject(Error('The host did not respond. Refresh status before retrying.'))},120000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
addEventListener('message',event=>{if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const m=event.data;if(pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}});
async function tool(name,args={}){if(!connected)throw Error('Open this interface through the BioNeMo plugin in Codex.');const result=await rpc('tools/call',{name,arguments:args});if(result.isError)throw Error(result.content?.find(x=>x.type==='text')?.text||'Tool failed');return result.structuredContent??JSON.parse(result.content?.find(x=>x.type==='text')?.text||'{}')}
function action(id,fn){$(id).onclick=async()=>{const b=$(id);b.disabled=true;try{await fn()}catch(e){$('status').textContent=e.message}finally{b.disabled=false}}}
function openStructure(value){const url=new URL(value.editor_url);if(!['localhost','127.0.0.1'].includes(url.hostname)||url.protocol!=='http:')throw Error('Unexpected Studio origin');session=value.session_id;plan=null;$('review').hidden=true;$('scene').src=url.href;$('scene').hidden=false;$('prepare').disabled=false;$('status').textContent=value.description||'Structure loaded. Use Studio’s annotation controls to edit model instructions.';}
function showPlan(value){plan=value;$('review').hidden=false;$('plan-summary').textContent=`${value.samples} design(s), seed ${value.seed}, Brev instance ${value.instance}. Snapshot ${value.sha256.slice(0,12)}. Generation uses this saved snapshot; subsequent edits require Review design again.`;$('warnings').textContent=(value.issues||[]).map(i=>i.message).join('\n');}
async function refresh(){const value=await tool('get_workspace');$('run-list').replaceChildren();for(const job of value.jobs){const row=document.createElement('p');const label=document.createElement('span');label.textContent=`${job.job_id.slice(0,8)} · ${job.status} `;row.append(label);const check=document.createElement('button');check.textContent='Check';check.onclick=async()=>{check.disabled=true;try{await tool('check_rfd4_job',{job_id:job.job_id});await refresh()}catch(e){$('status').textContent=e.message}finally{check.disabled=false}};row.append(check);if(job.status==='completed'){const view=document.createElement('button');view.textContent='View result';view.onclick=async()=>{view.disabled=true;try{openStructure(await tool('open_result',{job_id:job.job_id}))}catch(e){$('status').textContent=e.message}finally{view.disabled=false}};row.append(view)}$('run-list').append(row)}if(!value.jobs.length)$('run-list').textContent='No runs yet.';if(!plan&&value.plans.length)showPlan(value.plans[0]);}
action('demo',async()=>openStructure(await tool('load_demo')));
$('file').onchange=async()=>{try{const file=$('file').files[0];if(!file)return;if(file.size>20000000)throw Error('Use a CIF under 20 MB');openStructure(await tool('import_structure',{cif:await file.text()}))}catch(e){$('status').textContent=e.message}};
$('image-note').onchange=async()=>{try{const file=$('image-note').files[0];imageNote=null;if(!file)return;if(file.size>10000000)throw Error('Use a PNG image under 10 MB');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Cannot read image'));reader.readAsDataURL(file)});if(!data.startsWith('data:image/png;base64,'))throw Error('Use a PNG image');imageNote=data.split(',')[1];$('image-label').textContent=file.name+' will be saved alongside the design. Image notes do not add molecular conditions.'}catch(e){$('status').textContent=e.message}};
action('prepare',async()=>{if(!session)throw Error('Load a structure first');showPlan(await tool('prepare_design',{session_id:session,note:$('note').value,samples:Number($('samples').value),seed:Number($('seed').value),image_base64:imageNote}));});
action('request',async()=>{if(!plan)throw Error('Review a design first');const result=await rpc('ui/message',{role:'user',content:[{type:'text',text:`Please generate the reviewed RFD4 design using execute_rfd4_plan with plan_id ${plan.snapshot_id} and plan_checksum ${plan.plan_checksum}. The plan requests ${plan.samples} design(s), seed ${plan.seed}, on ${plan.instance}. Use this exact saved plan; do not substitute a new one.`}]});if(result?.isError)throw Error('Codex did not accept the generation request');$('status').textContent='Generation requested in chat. Codex will handle approval and launch; refresh Runs for status.'});
action('refresh',refresh);
async function init(){if(parent===window){$('status').textContent='This is an embedded Codex app. Open it from the BioNeMo plugin.';return}await rpc('ui/initialize',{appInfo:{name:'BioNeMo AtomWorks Studio',version:'0.1.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});connected=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');await refresh();openStructure(await tool('load_demo'));}
init().catch(e=>$('status').textContent=e.message);
</script></html>
